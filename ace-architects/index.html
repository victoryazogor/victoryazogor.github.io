<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ace Architects | Architecture, Engineering & Construction</title>
<meta name="description" content="Ace Architects provides architectural design, structural engineering, construction and project management services.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#ff6a13; --ink:#1a1a1a; --ink2:#2a2a2a; --paper:#fafafa; --white:#fff; --muted:#6b6b6b;
  --font:'Montserrat',Arial,sans-serif; --head:'Poppins','Montserrat',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{font-family:var(--font);color:var(--ink);background:var(--white);line-height:1.7;font-size:15px}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--head);line-height:1.2}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* top bar */
.topbar{background:var(--ink2);color:#aaa;font-size:12px;padding:8px 0}
.topbar .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.topbar b{color:#fff}

/* header */
.head{background:var(--white);padding:16px 0}
.head .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:700;font-size:22px;line-height:1}
.logo-mark{width:42px;height:42px;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:24px}
.logo small{display:block;font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.14em;margin-top:4px}
.contacts{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.contacts div{font-size:14px}
.contacts span{display:block;font-size:10px;color:var(--muted)}
.btn{display:inline-block;font-family:var(--head);font-weight:600;font-size:12px;padding:12px 22px;border:2px solid var(--orange);background:transparent;color:var(--ink);cursor:pointer}
.btn:hover{background:var(--orange);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:var(--orange);border-color:var(--orange)}
.btn.solid{background:var(--orange);border-color:var(--orange);color:#fff}
