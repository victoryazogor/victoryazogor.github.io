---
layout: default
---
<article class="poem-page wrap">
  <div class="poem-topbar">
    <a class="back-link" href="{{ '/poems/' | relative_url }}">← All poems</a>
    {% include music-button.html %}
  </div>
  <p class="eyebrow">POETRY / {{ page.date | date: "%B %d, %Y" }}</p>
  <h1 class="poem-title">{{ page.title }}</h1>
  {% if page.excerpt %}<p class="poem-excerpt">{{ page.excerpt }}</p>{% endif %}
  <div class="poem-content">{{ content }}</div>
  <div class="poem-end">— V.A.</div>
  <nav class="poem-pagination">
    ... (leave this part exactly as it is)
  </nav>
</article>
